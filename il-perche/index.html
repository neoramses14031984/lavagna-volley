    el("circle",{r:54,fill:fill,stroke:"#0b1426"},g);
    el("text",{x:0,y:2,fill:"#0b1426"},g);

function buildBattuta(){
  const idx=st.rot, rot=SEQ[idx], z=zonesOf(idx), d=defIds(idx), server=z[1], mid=liberoFor(z);
  const midServes=server===mid;
  const T=TXT.battuta, list=[], info={};
  for(const s of SLOTS){
    let id=d[s];
    if(midServes&&s==="B5") id=server;
    const isServer=id===server;
    const pos=isServer&&st.stage===0?[toCm([187,0])[0],975]:toCm(WAIT[s]);
    list.push({key:id,label:id,fill:fillOf(id),pos,cls:isServer?"att":""});
    let what,why;
    if(s==="F2"){ [what,why]=id==="P"?T.F2P:T.F2O; }
    else if(s==="B1"){ [what,why]=id==="P"?T.B1P:T.B1O; }
    else [what,why]=T[s];
    if(isServer){
      const dest= midServes ? "difende in zona 5 al posto del libero" : `va nel suo posto di difesa, in zona ${SLOTZONE[s]}`;
      info[id]={t:`${id} · batte`,what:`batte da dietro la linea di fondo (era in zona 1). Dopo il colpo entra in campo e ${dest}`,why:T.server};
    } else info[id]={t:`${id} · zona ${SLOTZONE[s]}`,what,why};
  }
  if(midServes){ list.push({key:"L",label:"L",fill:fillOf("L"),pos:[905,1010],cls:"ghost"}); info.L={t:"L · fuori",what:"è fuori dal campo",why:T.out}; }
  show(list); opp.classList.add("off"); arrows(null);
  st.info=info;
  return {rot:`<p class="k">${rot} · al servizio</p><p>Batte ${server}${midServes?`, il centrale che di solito il libero sostituisce: il libero esce e rientra a palla ferma`:""}. ${st.stage===0?"Gli altri sono già nei loro posti, come permettono le regole dal 2025.":"Dopo il colpo chi ha battuto entra nel suo posto di difesa."}</p>`};
}

    let what,why;
    if(id==="L"){ what="riceve"; why=`è lo specialista di ricezione e difesa: riceve sempre. Gioca al posto di ${mid}, il centrale di seconda linea.`; }
    else if(id[0]==="S"){ what=front?"riceve, anche se è di prima linea":"riceve"; why="gli schiacciatori ricevono sempre: il campo si divide in tre corsie e ognuno ne copre una."+(front?" Al colpo di servizio deve solo restare più vicino alla rete del suo difensore e nell'ordine della sua linea, poi arretra.":""); }
    else if(id==="P"){ what="non riceve: si prepara ad alzare"; why="se ricevesse lui non ci sarebbe chi alza. "+T.rot[rot].split(".")[0]+"."; }
    else if(id==="O"){ what="non riceve: si nasconde fuori dalla traiettoria della battuta"; why="si concentra sull'attacco. "+({P1:"In P1 attacca da zona 4, da dove si trova.",P6:"Attaccherà in zona 2.",P5:"Attaccherà in zona 2.",P4:"Attaccherà da zona 1, dietro i 3 metri.",P3:"Attaccherà da zona 1, dietro i 3 metri.",P2:"Passerà dietro i ricevitori fino a zona 1 per attaccare."})[rot]; }
    else { what="resta a rete, fuori dalla ricezione"; why="si prepara al primo tempo: deve essere pronto a saltare appena la palla arriva al palleggiatore."; }
    info[id]={t:`${id} · zona ${zn} di rotazione`,what,why};
  }
  show(list); opp.classList.add("off"); arrows(null); st.info=info;
  return {rot:`<p class="k">${rot} · ricezione</p><p>${T.rot[rot]}</p><p class="lead">Bordo verde: chi riceve.</p>`};
}
function buildAttacco(){
  const idx=st.rot, rot=SEQ[idx], T=TXT.attacco, list=[], info={};
  if(st.timer){ clearTimeout(st.timer); st.timer=null; }
  for(const id in ATTACK[rot]){
    const k=ATTACK[rot][id];
    let pos=st.stage===0?toCm(RECV[rot][id]):toCm(AT[k]);
    list.push({key:id,label:id,fill:fillOf(id),pos,cls:""});
    let [what,why]=T.role[k];
    if(rot==="P1"&&(id==="O"||id==="S1")) why+=" In P1 si attacca da dove si è: O e S1 si scambiano solo quando la nostra palla è passata di là e il gioco continua.";
    if(id==="O"&&(rot==="P6"||rot==="P5")) why+=" L'opposto è già comodo per andare in zona 2.";
    if(rot==="P2"&&id==="O") what+=", passando dietro i ricevitori";
    info[id]={t:`${id} · ${({set:"alza",mid:"primo tempo",left:"zona 4",right:"zona 2",pipe:"pipe",back1:"zona 1",cover:"copre"})[k]}`,what,why};
  }
  show(list);
  if(st.stage===1&&VIA[rot]){ for(const id in VIA[rot]){ const v=toCm(VIA[rot][id]), f=toCm(AT[ATTACK[rot][id]]); place(toks[id],v[0],v[1]); st.timer=setTimeout(()=>{ place(toks[id],f[0],f[1]); st.timer=null; },760); } }
  opp.classList.add("off"); arrows(null); st.info=info;
  return {rot:`<p class="k">${rot} · attacco</p><p>${T.rot[rot]}</p>`};
}
function buildCopertura(){
  const c=COVER[st.cov], list=[], info={};
  for(const [key,label,p,cls,what,why] of c.toks){
    list.push({key:"cv"+key,label,fill:label==="P"?"var(--ball)":"#fff",pos:toCm(p),cls});
    info["cv"+key]={t:`${label} · ${cls==="att"?"attaccante":cls==="near"?"copertura vicina":"copertura lontana"}`,what,why};
  }
  show(list); opp.classList.add("off"); arrows(null); st.info=info;
  return {rot:`<p class="k">${c.name}</p><p>Bordo verde: i tre vicini. Bordo tratteggiato: i due lontani. Bordo giallo: chi attacca.</p>`};
}
function buildDifesa(){
  const idx=st.rot, rot=SEQ[idx], d=defIds(idx), T=TXT.difesa, list=[], info={};
  for(const s of SLOTS){
    const id=d[s];
    list.push({key:id,label:id,fill:fillOf(id),pos:toCm(DEF[st.att][s]),cls:""});
    info[id]={t:`${id} · zona ${SLOTZONE[s]}`,what:T.role[st.att][s],why:T.why[st.att][s]};
  }
  show(list);
  const a=toCm(ATTPOS[st.att]); opp.classList.remove("off"); place(opp,a[0],a[1]); arrows(st.att);
  st.info=info;
  const pset=d.F2==="P"?"palleggiatore in prima linea":"palleggiatore in seconda linea";
  return {rot:`<p class="k">${rot} · ${({"4":"attacco da zona 4","3":"attacco dal centro","2":"attacco da zona 2"})[st.att]}</p><p>Ognuno è già nel suo ruolo (${pset}). Le frecce rosse sono i colpi più probabili.</p>`};
}

function pick(key){
  st.sel=key;
  for(const k in toks) toks[k].classList.toggle("sel",k===key);
  const i=st.info[key], w=document.getElementById("who");
  if(!i){ w.innerHTML=`<p class="k">Tocca un giocatore</p><p>Ti dice cosa fa in questa fase e perché.</p>`; return; }
  w.innerHTML=`<p class="k">${i.t}</p><p>${cap(i.what)}.</p><p class="why"><b>Perché:</b> ${cap(i.why)}</p>`;
}
function chips(box,items,cur,cb){
  box.textContent="";
  items.forEach(([k,t])=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=t; b.setAttribute("aria-pressed",k===cur); b.addEventListener("click",()=>cb(k)); box.appendChild(b); });
}
function render(){
  const ph=st.phase;
  chips(document.getElementById("phaseChips"),PHASES,ph,k=>{ st.phase=k; st.stage=k==="attacco"?1:0; st.sel=null; render(); });
  document.getElementById("rotBox").hidden=ph==="copertura";
  chips(document.getElementById("rotChips"),SEQ.map((r,i)=>[i,r]),st.rot,k=>{ st.rot=k; render(); });
  const ab=document.getElementById("attBox");
  ab.hidden=!(ph==="copertura"||ph==="difesa");
  if(ph==="difesa"){ document.getElementById("attK").textContent="Attacco avversario"; chips(document.getElementById("attChips"),[["4","Da zona 4"],["3","Dal centro"],["2","Da zona 2"]],st.att,k=>{ st.att=k; render(); }); }
  if(ph==="copertura"){ document.getElementById("attK").textContent="Chi attacca"; chips(document.getElementById("attChips"),[["4","Da zona 4"],["3","Primo tempo"],["2","Da zona 2"],["pipe","Pipe"]],st.cov,k=>{ st.cov=k; st.sel=null; render(); }); }
  const sb=document.getElementById("stageBox");
  const stages=ph==="battuta"?["Al servizio","Dopo il servizio"]:ph==="attacco"?["In ricezione","In attacco"]:null;
  sb.hidden=!stages; sb.textContent="";
  sb.style.gridTemplateColumns="repeat(2,1fr)";
  if(stages) stages.forEach((t,i)=>{ const b=document.createElement("button"); b.textContent=t; b.setAttribute("aria-pressed",i===st.stage); b.addEventListener("click",()=>{ st.stage=i; render(); }); sb.appendChild(b); });
  const r=({battuta:buildBattuta,ricezione:buildRicezione,attacco:buildAttacco,copertura:buildCopertura,difesa:buildDifesa})[ph]();
  document.getElementById("rotCard").innerHTML=r.rot;
  document.getElementById("prCard").innerHTML=`<p class="k">${({battuta:"Battuta",ricezione:"Ricezione",attacco:"Attacco (cambio palla)",copertura:"Copertura d'attacco",difesa:"Muro e difesa"})[ph]}: principi</p><ul class="pr">${TXT[ph].pr.map(t=>`<li>${t}</li>`).join("")}</ul>`;
  document.getElementById("legend").innerHTML=ph==="copertura"?`<span><i style="background:var(--ball)"></i>P palleggiatore</span><span><i style="background:#fff"></i>C centrale, SX e DX i giocatori ai lati, 5 6 1 i difensori</span>`:`<span><i style="background:var(--ball)"></i>P palleggiatore</span><span><i style="background:#fff"></i>O opposto, S1 S2 schiacciatori, C1 C2 centrali</span><span><i style="background:var(--libero)"></i>L libero</span>${ph==="difesa"?`<span><i style="background:var(--bad)"></i>A attaccante avversario</span>`:""}`;
  if(st.sel&&!st.info[st.sel]) st.sel=null;
  pick(st.sel);
}
render();
})();
</script>
</body>
</html>
